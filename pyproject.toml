[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yonah-agent"
version = "0.1.0"
description = "Yonah: dual-audience autonomous AI agent framework (backend, upstream)"
authors = [
    { name = "João Henrique da Rosa", email = "jh@jhcontext.com" },
]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # PAC-AI substrate (imported from PyPI, not vendored)
    "jhcontext-sdk>=0.3.1",
    "jhcontext-protocol>=0.3.1",

    # API framework
    "chalice>=1.31",

    # Persistence
    "pynamodb>=6.0",
    "boto3>=1.34",

    # Schemas
    "pydantic>=2.6",

    # CrewAI runtime
    "crewai>=0.86",
    "crewai-tools>=0.17",

    # LLM provider SDKs (multi-provider abstraction; user supplies key)
    "anthropic>=0.40",
    "openai>=1.50",
    "google-generativeai>=0.8",

    # Crypto for PII detacher KMS-wrapped envelopes
    "cryptography>=42",

    # Misc
    "ulid-py>=1.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "moto[dynamodb,sqs,kms,s3]>=5",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-requests",
]

[tool.setuptools.packages.find]
include = ["chalicelib*", "models*", "agent*", "worker*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
